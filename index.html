<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0a1a">
  <meta name="description" content="Mimi — فضای شخصی و فانتزی">
  <title>Mimi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/animations.css">
  <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="window-glow"></div>
  </div>

<button class="lock-btn" id="lockBtn" type="button" data-action="private" aria-label="باز کردن فضای خصوصی">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="5" y="11" width="14" height="10" rx="2"/>
    <path d="M8 11V8a4 4 0 0 1 8 0v3"/>
  </svg>
</button>

<button class="send-photo-btn" id="sendPhotoBtn" type="button" data-action="send-photo" aria-label="ارسال عکس برای شوهرم">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="3" y="3" width="18" height="18" rx="2"/>
    <circle cx="8.5" cy="8.5" r="1.5"/>
    <path d="M21 15l-5-5L5 21"/>
  </svg>
</button>

  <main class="main-content">
    <div class="deco-heart one" aria-hidden="true"></div>
    <div class="deco-heart two" aria-hidden="true"></div>

    <h1 class="logo">Mimi</h1>
    <p class="greeting">شلامم آیداجونممم 😍😍💋</p>
    <p class="sub-greeting">میدونم که عاشق معمایی پس ببینم چیکار میکنیااا...</p>

    <button class="cta-btn" id="ctaBtn" type="button">
      <span>🐣❤</span>
      <span>خیلی خیلی عاشقتم زندگیم</span>
      <span>❤🐣</span>
    </button>
  </main>

  <p class="page-label">صفحه اصلی</p>

  <!-- Password Modal -->
  <div class="modal-overlay" id="passwordModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <button class="modal-close" data-close-modal type="button" aria-label="بستن">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>

      <div class="modal-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <rect x="5" y="11" width="14" height="10" rx="2"/>
          <path d="M8 11V8a4 4 0 0 1 8 0v3"/>
        </svg>
      </div>

      <h2 class="modal-title" id="modalTitle">این قسمت یه در کوشولوی مخصوص داره 💞🤭</h2>
      <p class="modal-desc">رمز رو وارد کن ببینیم پشتش چه خبره...</p>

      <div class="password-wrap">
        <label for="passwordInput" class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">رمز ورود</label>
        <input
          type="password"
          id="passwordInput"
          class="password-input"
          placeholder="Password ••• Yasin"
          inputmode="numeric"
          autocomplete="off"
          maxlength="12"
          aria-describedby="errorMsg"
        >
        <button type="button" class="toggle-pass" id="togglePass" aria-label="نمایش رمز">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>

      <p class="error-msg" id="errorMsg" role="alert"></p>

      <button type="button" class="enter-btn" id="enterBtn">ورود</button>
      <button type="button" class="close-text-btn" data-close-modal>بستن</button>
    </div>
  </div>

  <script src="./js/main.js"></script>
</body>
</html>
